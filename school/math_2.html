<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Exercise Tool</title>
    
    <!-- 
    PROJECT METADATA FOR AI EVOLUTION:
    
    PURPOSE: Interactive math exercise generator for elementary students
    
    ARCHITECTURE:
    - Central circular layout with target number (z) in center
    - Operation selection via radio buttons at top
    - 6 exercises positioned around circle using polar coordinates
    - Each exercise format: "x [operation] ? = z" where user fills missing operand
    - Real-time validation with visual feedback (green/red styling)
    - Score tracking and progress monitoring
    - Operation-specific constraint system for valid problem generation
    
    CURRENT CONSTRAINTS BY OPERATION:
    - Addition (+): x >= 1, z >= x, y = z - x (ensures y >= 0)
    - Subtraction (-): x >= 1, x >= z, y = x - z (ensures y >= 0)
    - Multiplication (*): x >= 1, z % x == 0, z >= x, y = z / x (ensures integer y >= 1)
    - Division (/): x >= z, x % z == 0, z >= 1, y = x / z (ensures integer y >= 1)
    
    EXTENSIBILITY IMPLEMENTED:
    - Modular operation constraint system via getOperationConstraints()
    - Operation-specific value generation in generateExercise()
    - Dynamic operation symbol display
    - Extensible radio button operation selection
    
    KEY FUNCTIONS:
    - generateExercise(): Creates problems based on selected operation constraints
    - checkAnswers(): Validates using operation-specific calculation
    - getOperationConstraints(): Returns valid ranges for current operation
    - calculateAnswer(): Computes correct answer for given operation
    - Polar coordinate positioning for circular layout
    
    STYLING: Modern gradient design with operation selector, hover effects, responsive layout
    
    EDUCATIONAL FEATURES:
    - Multiple operation support for varied learning
    - Operation-specific constraint logic ensures valid problems
    - Immediate feedback with color coding
    - Score tracking for progress monitoring
    - Engaging visual design to maintain student interest
    - Enter key support for quick answer checking
    
    TECHNICAL NOTES:
    - Pure HTML/CSS/JavaScript implementation
    - No external dependencies
    - Modular constraint system for easy operation addition
    - Event-driven validation system
    - Transform positioning for exercise placement
    
    CURRENT STATE CHECKSUM:
    - Exercise count: 6 fixed exercises per generation
    - Operations supported: Addition (+), Subtraction (-), Multiplication (*), Division (/)
    - Target range: Operation-dependent via getOperationConstraints()
    - X value range: Operation-dependent via getOperationConstraints()
    - Layout: Circular with 180px radius, starting angle -90° (top)
    - Input validation: Operation-specific via calculateAnswer()
    - Score system: correctAnswers / totalAttempts
    - Feedback system: Color-coded (green=correct, red=incorrect)
    - Keyboard support: Enter key triggers checkAnswers()
    - Visual feedback: Hover effects, transform animations
    - Operation selection: Radio buttons with change event handling
    
    VERSION HISTORY:
    - v1.0: Initial creation with negative x values
    - v1.1: Changed to positive x values (x >= 1), adjusted target range
    - v1.2: Added comprehensive AI metadata documentation
    - v2.0: Major refactor - added multi-operation support, constraint system, radio selection
    -->

</head>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .operation-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }

        .operation-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .operation-option:hover {
            background: #e9ecef;
        }

        .operation-option input[type="radio"] {
            display: none;
        }

        .operation-option.selected {
            background: #667eea;
            color: white;
        }

        .exercise-area {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 30px;
            background: #f8f9fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #667eea;
        }

        .target-value {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }

        .exercise {
            position: absolute;
            background: white;
            padding: 10px 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            font-weight: bold;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .exercise:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .exercise.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .exercise.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .exercise input {
            width: 60px;
            padding: 5px;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            -moz-appearance: textfield; /* Remove spinners in Firefox */
        }

        .exercise input::-webkit-outer-spin-button,
        .exercise input::-webkit-inner-spin-button {
            -webkit-appearance: none; /* Remove spinners in Chrome/Safari */
            margin: 0;
        }

        .exercise input:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .check-btn {
            background: #28a745;
            color: white;
        }

        .check-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .generate-btn {
            background: #667eea;
            color: white;
        }

        .generate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .feedback {
            text-align: center;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 30px;
        }

        .feedback.success {
            color: #28a745;
        }

        .feedback.error {
            color: #dc3545;
        }

        .score {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Math Exercise</h1>
        
        <div class="operation-selector">
            <label class="operation-option selected">
                <input type="radio" name="operation" value="+" checked onchange="onOperationChange()">
                <span>➕ Addition</span>
            </label>
            <!-- Temporarily hidden - will be enabled later
            <label class="operation-option">
                <input type="radio" name="operation" value="-" onchange="onOperationChange()">
                <span>➖ Subtraction</span>
            </label>
            <label class="operation-option">
                <input type="radio" name="operation" value="*" onchange="onOperationChange()">
                <span>✖️ Multiplication</span>
            </label>
            <label class="operation-option">
                <input type="radio" name="operation" value="/" onchange="onOperationChange()">
                <span>➗ Division</span>
            </label>
            -->
        </div>
        
        <div class="exercise-area" id="exerciseArea">
            <div class="target-value" id="targetValue">10</div>
        </div>

        <div class="buttons">
            <button class="check-btn" onclick="checkAnswers()">✓ Check</button>
            <button class="generate-btn" onclick="generateExercise()">🎲 Generate</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="score" id="score">Score: 0 / 0</div>
    </div>

    <script>
        let currentTarget = 10;
        let exercises = [];
        let totalAttempts = 0;
        let correctAnswers = 0;
        let currentOperation = '+';

        // Operation-specific constraints and logic
        const operationConstraints = {
            '+': {
                getTargetRange: () => ({ min: 5, max: 99 }),
                getXRange: (target) => ({ min: 1, max: target - 1 }),
                isValidCombination: (x, target) => {
                    if (x >= target) return false; // y must be > 0
                    
                    const y = target - x;
                    if (y <= 0) return false;
                    
                    if (target <= 9) {
                        return true; // No extra conditions for single digit z
                    }
                    
                    // For two-digit z = ab
                    const onesDigitZ = target % 10;
                    
                    if (y <= 9) {
                        // If y has 1 digit: y <= b
                        return y <= onesDigitZ;
                    } else {
                        // If y has 2 digits like y = de: e < b
                        const onesDigitY = y % 10;
                        return onesDigitY < onesDigitZ;
                    }
                },
                generateValidTarget: () => Math.floor(Math.random() * 95) + 5,
                generateValidX: (target) => {
                    let attempts = 0;
                    let x;
                    
                    do {
                        x = Math.floor(Math.random() * (target - 1)) + 1;
                        attempts++;
                    } while (!operationConstraints['+'].isValidCombination(x, target) && attempts < 100);
                    
                    return x;
                }
            },
            '-': {
                getTargetRange: () => ({ min: 1, max: 20 }),
                getXRange: (target) => ({ min: target + 1, max: target + 20 }),
                isValidCombination: (x, target) => x > target,
                generateValidTarget: () => Math.floor(Math.random() * 20) + 1,
                generateValidX: (target) => Math.floor(Math.random() * 20) + target + 1
            },
            '*': {
                getTargetRange: () => ({ min: 2, max: 50 }),
                getXRange: (target) => ({ min: 2, max: Math.floor(target / 2) }),
                isValidCombination: (x, target) => target % x === 0 && x <= target && target / x >= 2,
                generateValidTarget: () => {
                    const factors = [4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 21, 24, 25, 27, 28, 30, 32, 35, 36, 40, 42, 45, 48, 49, 50];
                    return factors[Math.floor(Math.random() * factors.length)];
                },
                generateValidX: (target) => {
                    const factors = [];
                    for (let i = 2; i <= Math.min(target / 2, 10); i++) {
                        if (target % i === 0) factors.push(i);
                    }
                    return factors.length > 0 ? factors[Math.floor(Math.random() * factors.length)] : 2;
                }
            },
            '/': {
                getTargetRange: () => ({ min: 2, max: 10 }),
                getXRange: (target) => ({ min: target * 2, max: target * 10 }),
                isValidCombination: (x, target) => x % target === 0 && x >= target,
                generateValidTarget: () => Math.floor(Math.random() * 9) + 2,
                generateValidX: (target) => target * (Math.floor(Math.random() * 9) + 2)
            }
        };

        function getOperationConstraints() {
            return operationConstraints[currentOperation];
        }

        function calculateAnswer(x, target, operation) {
            switch (operation) {
                case '+': return target - x;
                case '-': return x - target;
                case '*': return target / x;
                case '/': return x / target;
                default: return 0;
            }
        }

        function onOperationChange() {
            // Update current operation
            currentOperation = document.querySelector('input[name="operation"]:checked').value;
            
            // Update visual selection
            document.querySelectorAll('.operation-option').forEach(option => {
                option.classList.remove('selected');
            });
            document.querySelector('input[name="operation"]:checked').closest('.operation-option').classList.add('selected');
            
            // Generate new exercise with the selected operation
            generateExercise();
        }

        function generateExercise() {
            const constraints = getOperationConstraints();
            
            // Generate valid target and x values based on operation constraints
            let target, xValue;
            let attempts = 0;
            
            do {
                target = constraints.generateValidTarget();
                xValue = constraints.generateValidX(target);
                attempts++;
            } while (!constraints.isValidCombination(xValue, target) && attempts < 50);
            
            currentTarget = target;
            document.getElementById('targetValue').textContent = currentTarget;
            
            // Clear previous exercises
            const exerciseArea = document.getElementById('exerciseArea');
            const existingExercises = exerciseArea.querySelectorAll('.exercise');
            existingExercises.forEach(ex => ex.remove());
            
            exercises = [];
            
            // Generate 6 exercises around the circle
            const numExercises = 6;
            const radius = 180;
            
            for (let i = 0; i < numExercises; i++) {
                const angle = (i * 360 / numExercises) - 90; // Start from top
                const x = Math.cos(angle * Math.PI / 180) * radius;
                const y = Math.sin(angle * Math.PI / 180) * radius;
                
                // Generate valid x value for current operation
                let exerciseX;
                let exerciseTarget = currentTarget;
                let attemptCount = 0;
                
                do {
                    exerciseX = constraints.generateValidX(exerciseTarget);
                    attemptCount++;
                } while (!constraints.isValidCombination(exerciseX, exerciseTarget) && attemptCount < 20);
                
                const correctAnswer = calculateAnswer(exerciseX, exerciseTarget, currentOperation);
                
                const exerciseDiv = document.createElement('div');
                exerciseDiv.className = 'exercise';
                exerciseDiv.style.left = `calc(50% + ${x}px)`;
                exerciseDiv.style.top = `calc(50% + ${y}px)`;
                exerciseDiv.style.transform = 'translate(-50%, -50%)';
                
                exerciseDiv.innerHTML = `
                    <span>${exerciseX}</span>
                    <span>${currentOperation}</span>
                    <input type="text" data-answer="${correctAnswer}" placeholder="?" 
                           oninput="validateNumericInput(this)" 
                           onfocus="selectAllContent(this)"
                           onkeypress="return isNumericKey(event)">
                `;
                
                exerciseArea.appendChild(exerciseDiv);
                exercises.push({
                    element: exerciseDiv,
                    xValue: exerciseX,
                    targetValue: exerciseTarget,
                    correctAnswer: correctAnswer
                });
            }
            
            // Clear feedback
            document.getElementById('feedback').textContent = '';
            
            // Reset exercise styles
            exercises.forEach(ex => {
                ex.element.className = 'exercise';
            });
        }

        function checkAnswers() {
            let allCorrect = true;
            let answeredCount = 0;
            
            exercises.forEach(exercise => {
                const input = exercise.element.querySelector('input');
                const userAnswer = parseFloat(input.value);
                
                if (input.value.trim() === '') {
                    exercise.element.className = 'exercise';
                    return;
                }
                
                answeredCount++;
                
                if (Math.abs(userAnswer - exercise.correctAnswer) < 0.001) { // Handle floating point precision
                    exercise.element.className = 'exercise correct';
                } else {
                    exercise.element.className = 'exercise incorrect';
                    allCorrect = false;
                }
            });
            
            const feedback = document.getElementById('feedback');
            
            if (answeredCount === 0) {
                feedback.textContent = 'Please fill in at least one answer!';
                feedback.className = 'feedback error';
                return;
            }
            
            if (allCorrect && answeredCount === exercises.length) {
                feedback.textContent = '🎉 Excellent! All answers are correct!';
                feedback.className = 'feedback success';
                correctAnswers++;
            } else {
                const correctCount = exercises.filter(ex => 
                    ex.element.classList.contains('correct')
                ).length;
                feedback.textContent = `${correctCount} out of ${answeredCount} correct. Keep trying!`;
                feedback.className = 'feedback error';
            }
            
            totalAttempts++;
            updateScore();
        }

        function updateScore() {
            const score = document.getElementById('score');
            score.textContent = `Score: ${correctAnswers} / ${totalAttempts}`;
        }

        // Initialize with first exercise
        generateExercise();

        // Allow Enter key to check answers
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswers();
            }
        });

        // Numeric input validation functions
        function isNumericKey(event) {
            const char = String.fromCharCode(event.which);
            if (!(/[0-9]/.test(char)) && event.which !== 8 && event.which !== 0) {
                event.preventDefault();
                return false;
            }
            return true;
        }

        function validateNumericInput(input) {
            // Remove any non-numeric characters
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        function selectAllContent(input) {
            input.select();
        }
    </script>
</body>
</html>
